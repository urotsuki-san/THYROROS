name: Bug report
description: Report a reproducible THYROROS bug.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        For suspected security vulnerabilities, use the private Security Advisory link instead of a public issue.
        Do not include credentials, private data, or live malware.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.2.0 or a full commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: 3.13.5
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest example you can. Redact personal paths and data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the reason code or exit code when relevant.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `python scripts/check_repo.py` on the affected revision.
          required: true
        - label: This report contains no secrets or private data.
          required: true
        - label: This is not a suspected security vulnerability.
          required: true
